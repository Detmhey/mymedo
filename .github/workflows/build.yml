name: Сборка мода Minecraft

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Собрать мод
        run: gradle build --no-daemon

      - name: Загрузить JAR-файл
        uses: actions/upload-artifact@v4
        with:
          name: ForgeIntroMod
          path: build/libs/*.jar
